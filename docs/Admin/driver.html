<!DOCTYPE html>
<html lang="mr">
<head>
  <!-- Single source of truth for the deployed version. The runtime
       compares this to the *_VERSION constant baked into the JS and
       silently hard-refreshes if they differ — closes the "user is
       running yesterday's cached HTML" gap. -->
  <meta name="app-version" content="v26.06.04.2">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Svaadh Delivery</title>
<link rel="icon" type="image/x-icon" href="../images/svaadh-kitchen-hero.PNG">
<link rel="shortcut icon" href="../images/svaadh-kitchen-hero.PNG">
<link rel="stylesheet" href="../modals-svaadh.css">
<script src="../modals-svaadh.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#222;min-height:100vh;}

  /* ── LOGIN ── */
  #loginWrap{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:100;}
  .login-box{padding:32px 24px;width:100%;max-width:320px;text-align:center;}
  .login-logo{font-size:2rem;margin-bottom:4px;}
  .login-box h1{font-size:1.2rem;font-weight:700;color:#1E1240;margin-bottom:2px;}
  .login-box p{font-size:0.78rem;color:#999;margin-bottom:24px;}
  .pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:24px;}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #ddd;transition:all 0.15s;}
  .pin-dot.filled{background:#1E1240;border-color:#1E1240;}
  .pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto;}
  .pk{background:#f5f5f5;border:none;color:#222;font-size:1.5rem;font-weight:600;border-radius:14px;padding:16px;cursor:pointer;transition:background 0.1s;}
  .pk:active{background:#e0e0e0;}
  .pk.del{color:#999;font-size:1.2rem;}
  .pk.span2{grid-column:span 2;}
  .login-err{color:#c0392b;font-size:0.78rem;margin-top:14px;min-height:18px;}

  /* ── SHELL ── */
  #shell{display:none;padding-bottom:100px;}
  #shell.on{display:block;}

  /* ── TOP BAR ── */
  .topbar{background:#1E1240;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10;}
  .topbar-row1{display:flex;align-items:center;justify-content:space-between;}
  .topbar-title{font-size:1rem;font-weight:700;letter-spacing:0.03em;}
  .sync-badge{font-size:0.65rem;color:rgba(255,255,255,0.65);background:rgba(0,0,0,0.15);padding:2px 8px;border-radius:99px;}
  .topbar-date{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .topbar-date input[type=date]{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:5px 10px;border-radius:8px;font-size:0.8rem;flex:1;}
  .topbar-date input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);}
  .load-btn{background:#fff;color:#1E1240;border:none;font-weight:700;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:0.8rem;white-space:nowrap;}
  .export-btn{background:#E8C840;color:#1a1400;border:none;font-weight:700;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:0.8rem;white-space:nowrap;}
  .export-btn:active{background:#c9ab00;}

  /* ── EXPORT MODAL ── */
  .export-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
  .export-modal{background:#fff;border-radius:16px;padding:24px 20px;width:100%;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,0.18);}
  .export-modal h3{margin:0 0 16px;font-size:1rem;color:#1E1240;}
  .export-modal label{display:block;font-size:0.78rem;font-weight:600;color:#555;margin-bottom:4px;margin-top:12px;}
  .export-modal select,.export-modal input[type=date]{width:100%;padding:8px 10px;border:1.5px solid #ddd;border-radius:8px;font-size:0.85rem;box-sizing:border-box;}
  .export-modal-actions{display:flex;gap:10px;margin-top:20px;}
  .export-modal-actions button{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;font-size:0.85rem;cursor:pointer;}
  .export-cancel-btn{background:#f0f0f0;color:#555;}
  .export-confirm-btn{background:#E8C840;color:#1a1400;}

  /* ── TABS ── */
  .tabs{display:flex;background:#fff;border-bottom:2px solid #eee;position:sticky;top:90px;z-index:9;}
  .tab{flex:1;padding:12px 4px;text-align:center;font-size:0.8rem;font-weight:600;color:#aaa;border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;transition:all 0.15s;}
  .tab.active{color:#1E1240;border-bottom-color:#1E1240;}
  .tab-count{display:inline-block;background:#f0f0f0;color:#888;font-size:0.65rem;padding:1px 6px;border-radius:10px;margin-left:4px;}
  .tab.active .tab-count{background:#fde8e8;color:#1E1240;}

  /* ── PROGRESS STRIP ── */
  .progress-strip{background:#fff;border-bottom:1px solid #f0f0f0;padding:8px 14px;display:flex;align-items:center;gap:10px;}
  .progress-bar-wrap{flex:1;height:6px;background:#eee;border-radius:99px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:#27ae60;border-radius:99px;transition:width 0.4s ease;}
  .progress-text{font-size:0.72rem;font-weight:700;color:#555;white-space:nowrap;}
  .progress-text.done{color:#27ae60;}
  /* cash-badge removed */

  /* ── AMOUNT BADGE ── */
  .amount-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .amount-badge{font-size:0.82rem;font-weight:700;padding:5px 12px;border-radius:8px;background:#eafaf1;color:#27ae60;}
  .amount-badge.postpaid{background:#e3f2fd;color:#1976d2;}

  /* ── CARD ACTIONS (3 buttons) ── */
  .btn-whatsapp{flex:1;background:#25d366;color:#fff;border:none;border-radius:10px;padding:11px;font-size:0.85rem;font-weight:700;cursor:pointer;text-decoration:none;text-align:center;display:block;}

  /* ── ALL DONE OVERLAY ── */
  .all-done-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:200;}
  .done-box{background:#fff;border-radius:20px;padding:32px 24px;text-align:center;width:88%;max-width:340px;animation:popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);}
  @keyframes popIn{from{transform:scale(0.7);opacity:0;}to{transform:scale(1);opacity:1;}}
  .done-emoji{font-size:3.5rem;margin-bottom:8px;}
  .done-title{font-size:1.3rem;font-weight:800;color:#27ae60;margin-bottom:4px;}
  .done-sub{font-size:0.82rem;color:#888;margin-bottom:20px;}
  .done-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
  .done-stat{background:#f8f8f8;border-radius:12px;padding:12px 8px;grid-column:span 2;}
  .done-stat-val{font-size:1.3rem;font-weight:800;color:#222;}
  .done-stat-lbl{font-size:0.68rem;color:#999;margin-top:2px;}
  .done-close{width:100%;padding:13px;background:#1E1240;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;}

  /* ── ROUTE BAR ── */
  .route-bar{background:#fff;border-bottom:1px solid #eee;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .route-btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:0.78rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;}
  .route-btn:active{background:#1558b0;}
  .route-btn.green{background:#27ae60;}
  .route-info{font-size:0.75rem;color:#555;flex:1;}
  .route-maps-link{font-size:0.78rem;font-weight:700;color:#1a73e8;text-decoration:none;padding:7px 12px;border:1.5px solid #1a73e8;border-radius:8px;white-space:nowrap;}

  /* ── CONTENT ── */
  .meal-panel{display:none;padding:12px 14px;}
  .meal-panel.active{display:block;}

  /* ── ORDER CARD ── */
  .order-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.07);border-left:4px solid transparent;transition:border-color 0.2s;}
  .order-card.delivered{border-left-color:#27ae60;opacity:0.72;}
  .order-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .order-num{font-size:0.65rem;font-weight:700;color:#1E1240;letter-spacing:0.05em;}
  .delivered-time{font-size:0.68rem;font-weight:700;color:#27ae60;background:#eafaf1;padding:2px 8px;border-radius:99px;}
  .cust-name{font-size:1.05rem;font-weight:700;color:#111;margin-bottom:2px;}
  .cust-phone{font-size:0.85rem;color:#666;margin-bottom:10px;}
  .address-box{background:#f9f9f9;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:0.82rem;color:#444;line-height:1.5;}

  /* ── MOBILE OPT ── */
  @media (max-width: 400px) {
    .topbar-title { font-size: 0.9rem; }
    .tab { font-size: 0.72rem; padding: 12px 2px; }
    .cust-name { font-size: 0.98rem; }
    .btn-whatsapp { font-size: 0.8rem; padding: 10px; }
  }
  .landmark{font-size:0.78rem;color:#888;margin-top:4px;}
  .landmark span{color:#e67e22;font-weight:600;}
  .notes-box{background:#fff8e1;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:0.78rem;color:#856404;}
  .card-actions{display:flex;gap:8px;margin-bottom:10px;}
  .btn-call{flex:1;background:#27ae60;color:#fff;border:none;border-radius:10px;padding:11px;font-size:0.85rem;font-weight:700;cursor:pointer;text-decoration:none;text-align:center;display:block;}
  .btn-maps{flex:1;background:#1a73e8;color:#fff;border:none;border-radius:10px;padding:11px;font-size:0.85rem;font-weight:700;cursor:pointer;text-decoration:none;text-align:center;display:block;}
  .btn-maps.disabled{background:#ccc;pointer-events:none;}

  /* ── DELIVERED BUTTON ── */
  .btn-delivered{width:100%;padding:12px;border-radius:10px;border:2px dashed #ccc;background:#fafafa;color:#888;font-size:0.88rem;font-weight:700;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-delivered:active{background:#f0f0f0;}
  .btn-delivered.done{border:2px solid #27ae60;background:#eafaf1;color:#27ae60;cursor:default;}

  /* ── EMPTY / LOADING ── */
  .empty{text-align:center;padding:48px 20px;color:#aaa;}
  .empty-icon{font-size:2.5rem;margin-bottom:8px;}
  .spinner{width:28px;height:28px;border:3px solid #eee;border-top-color:#1E1240;border-radius:50%;animation:spin 0.7s linear infinite;margin:40px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .wake-status {
    font-size: 0.65rem;
    font-weight: 700;
    color: rgba(255,255,255,0.6);
    background: rgba(0,0,0,0.1);
    padding: 2px 8px;
    border-radius: 99px;
    display: flex;
    align-items: center;
    gap: 4px;
    margin-right: 10px;
  }
  .wake-status.active {
    background: #27ae60;
    color: #fff;
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginWrap">
  <div class="login-box">
    <div class="login-logo">🛵</div>
    <h1>Svaadh Delivery</h1>
    <p>Enter PIN to view deliveries</p>
    <div class="pin-dots">
      <div class="pin-dot" id="dd0"></div><div class="pin-dot" id="dd1"></div>
      <div class="pin-dot" id="dd2"></div><div class="pin-dot" id="dd3"></div>
    </div>
    <div class="pin-grid">
      <button class="pk" onclick="dp(1)">1</button><button class="pk" onclick="dp(2)">2</button><button class="pk" onclick="dp(3)">3</button>
      <button class="pk" onclick="dp(4)">4</button><button class="pk" onclick="dp(5)">5</button><button class="pk" onclick="dp(6)">6</button>
      <button class="pk" onclick="dp(7)">7</button><button class="pk" onclick="dp(8)">8</button><button class="pk" onclick="dp(9)">9</button>
      <button class="pk span2" onclick="dp(0)">0</button><button class="pk del" onclick="dx()">⌫</button>
    </div>
    <div class="login-err" id="dErr"></div>
  </div>
</div>

<!-- SHELL -->
<div id="shell">
  <div class="topbar">
    <div class="topbar-row1">
      <div class="topbar-title">🛵 Svaadh Delivery</div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div id="wakeStatus" class="wake-status">⚡ Wake: Off</div>
        <span class="sync-badge" id="syncBadge">—</span>
        <button onclick="logout()" style="background:none;border:none;color:#fff;font-size:1.1rem;cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;opacity:0.8;" title="Logout">🔐</button>
        <span id="appVerBadge" title="App version — auto-refreshes when a new build is deployed" style="font-size:0.62rem; color:rgba(255,255,255,0.55); font-weight:600; padding:1px 6px; border:1px solid rgba(255,255,255,0.2); border-radius:8px;"></span>
      </div>
    </div>
    <div class="topbar-date">
      <input type="date" id="datePicker" onchange="loadOrders()">
      <button class="load-btn" onclick="loadOrders()">↻ Refresh</button>
      <button class="export-btn" onclick="openExportModal()">⬇ Export</button>
      <button class="export-btn" onclick="rebuildRoute()" title="Learn the best stop order from the last 30 days of deliveries">🧭 Optimize route</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:6px 4px 0;flex-wrap:wrap;">
      <span style="font-size:0.66rem;color:rgba(255,255,255,0.6);">Sort by:</span>
      <div style="display:inline-flex;border:1px solid rgba(255,255,255,0.25);border-radius:99px;overflow:hidden;">
        <button id="sortBtnRoute" onclick="setSortMode('route')" style="background:none;border:none;color:#fff;font-size:0.68rem;font-weight:700;padding:4px 12px;cursor:pointer;">🧭 Route</button>
        <button id="sortBtnName" onclick="setSortMode('name')" style="background:none;border:none;color:#fff;font-size:0.68rem;font-weight:700;padding:4px 12px;cursor:pointer;">🔤 A–Z</button>
      </div>
      <span id="routeStatus" style="font-size:0.62rem;color:rgba(255,255,255,0.55);"></span>
    </div>
  </div>

  <!-- EXPORT MODAL -->
  <div class="export-modal-overlay" id="exportModal" style="display:none;" onclick="if(event.target===this)closeExportModal()">
    <div class="export-modal">
      <h3>📋 Export Delivery Sheet</h3>
      <label>Date</label>
      <input type="date" id="exportDate">
      <label>Meal</label>
      <select id="exportMeal">
        <option value="Breakfast">🌅 Breakfast</option>
        <option value="Lunch">☀️ Lunch</option>
        <option value="Dinner">🌙 Dinner</option>
      </select>
      <div class="export-modal-actions">
        <button class="export-cancel-btn" onclick="closeExportModal()">Cancel</button>
        <button class="export-confirm-btn" onclick="confirmExport()">📄 Save to Drive</button>
      </div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" id="tab_Breakfast" onclick="switchTab('Breakfast')">🌅 Breakfast<span class="tab-count" id="cnt_Breakfast">0</span></button>
    <button class="tab" id="tab_Lunch" onclick="switchTab('Lunch')">☀️ Lunch<span class="tab-count" id="cnt_Lunch">0</span></button>
    <button class="tab" id="tab_Dinner" onclick="switchTab('Dinner')">🌙 Dinner<span class="tab-count" id="cnt_Dinner">0</span></button>
  </div>

  <!-- PROGRESS STRIP -->
  <div class="progress-strip" id="progressStrip" style="display:none;">
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">0 / 0</div>
    <!-- cash-badge removed -->
  </div>

  <!-- ALL DONE OVERLAY -->
  <div class="all-done-overlay" id="allDoneOverlay" style="display:none;">
    <div class="done-box">
      <div class="done-emoji">🎉</div>
      <div class="done-title">All Deliveries Done!</div>
      <div class="done-sub" id="doneSub">Great work today!</div>
      <div class="done-stats" id="doneStats"></div>
      <button class="done-close" onclick="document.getElementById('allDoneOverlay').style.display='none'">✓ Close</button>
    </div>
  </div>

  <!-- PANELS -->
  <div class="meal-panel active" id="panel_Breakfast"></div>
  <div class="meal-panel" id="panel_Lunch"></div>
  <div class="meal-panel" id="panel_Dinner"></div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-wwECc_mSh949babtRt8OAvFbnJJzH5X9JS_PsN-f-IMHeYkQMj54fwXRs6PevK0W/exec";

// ── FETCH WITH TIMEOUT (Timeout removed per user request: let request take whatever time it needs) ──
async function fetchWithTimeout(url, options = {}, timeoutMs) {
  const fetchOpts = typeof options === 'number' ? {} : options;
  return fetch(url, fetchOpts);
}

// ── KITCHEN LOCATION — update to your actual kitchen lat/lng ──────────────────
// Current: approx Bhosale Nagar, Hadapsar, Pune
// Svaadh Kitchen — verified from Maps share link (!3d/!4d coords from URL)
const KITCHEN = { lat: 18.5034868, lng: 73.9337571 };

let D = { pin: "", sessionPin: "" };
let _ordersData = { Breakfast: [], Lunch: [], Dinner: [] };
let _pollTimer  = null;
// Learned delivery route: { meal: { societyKey: rank } } — drives undelivered sort.
let _deliveryRoute = {};
let _routeUpdated  = "";
let _lastData      = null; // last driver payload, for re-render on sort toggle
// Undelivered sort mode: "route" (learned building order) or "name" (A–Z). Persisted.
let _sortMode      = localStorage.getItem("sk_driver_sort") || "route";
let _routeDists = { Breakfast: null, Lunch: null, Dinner: null };
// Per-meal search query — kept independent so searching in Lunch never
// leaks into Breakfast/Dinner panels.
let _searchQuery = { Breakfast: "", Lunch: "", Dinner: "" };

function applyDriverSearch(meal, query) {
  if (typeof query === "string") _searchQuery[meal] = query;
  const q = (_searchQuery[meal] || "").toLowerCase().trim();
  const panel = document.getElementById("panel_" + meal);
  if (!panel) return;
  const cards = panel.querySelectorAll(".order-card[data-meal='" + meal + "']");
  let shown = 0;
  cards.forEach(card => {
    const name = card.getAttribute("data-search") || "";
    const match = !q || name.indexOf(q) !== -1;
    card.style.display = match ? "" : "none";
    if (match) shown++;
  });
  const meta = document.getElementById("searchMeta_" + meal);
  if (meta) {
    if (!q) meta.textContent = "";
    else if (shown === 0) meta.textContent = "No matches in " + meal;
    else meta.textContent = "Showing " + shown + " of " + cards.length;
  }
}

function clearDriverSearch(meal) {
  _searchQuery[meal] = "";
  const input = document.getElementById("search_" + meal);
  if (input) input.value = "";
  applyDriverSearch(meal, "");
  // Hide the clear-button on next render by re-applying empty value;
  // the input is still focusable and ready for another query.
}

    // ── APP VERSION + AUTO-UPDATE ──
    // Match this string to the <meta name="app-version"> tag in <head>.
    // On every page load we fetch the deployed HTML (cache-busted) and
    // compare its meta-version to this constant. If they differ, the
    // user is running cached/stale HTML — silently hard-reload so the
    // newest build always wins. No prompts.
    const DRIVER_VERSION = "v26.06.04.2";
    (async function _versionCheck() {
      try {
        const badge = document.getElementById("appVerBadge");
        if (badge) badge.textContent = DRIVER_VERSION;
        const res = await fetch(window.location.pathname + "?_v=" + Date.now(), { cache: "no-store" });
        if (!res.ok) return;
        const html = await res.text();
        const m = html.match(/<meta\s+name=["']app-version["']\s+content=["']([^"']+)["']/i);
        if (m && m[1] && m[1] !== DRIVER_VERSION) {
          console.log("[Driver] Version mismatch: running=" + DRIVER_VERSION
                      + ", latest=" + m[1] + " — reloading to pick up new build");
          const sep = window.location.href.indexOf("?") === -1 ? "?" : "&";
          window.location.replace(window.location.href + sep + "_v=" + Date.now());
        }
      } catch (_) { /* network blip — try again next load */ }
    })();

// ── RATE LIMITING ──
let attempts = 0;
let lockoutEnd = 0;
function isLocked() {
  if (Date.now() < lockoutEnd) {
    const s = Math.ceil((lockoutEnd - Date.now()) / 1000);
    document.getElementById("dErr").textContent = `Too many attempts. Wait ${s}s.`;
    return true;
  }
  if (lockoutEnd !== 0) {
    lockoutEnd = 0; attempts = 0;
    document.getElementById("dErr").textContent = "";
  }
  return false;
}

// ── PIN ────────────────────────────────────────────────────────────────────────
let pinAuthInProgress = false;
function dp(n) {
  if (isLocked() || pinAuthInProgress) return;
  if (D.pin.length >= 4) return;
  D.pin += String(n);
  renderDots();
  if (D.pin.length === 4) verifyPin();
}
function dx() { 
  if (pinAuthInProgress) return;
  D.pin = D.pin.slice(0,-1); 
  renderDots(); 
  document.getElementById("dErr").textContent = ""; 
}
function renderDots() {
  for (let i=0;i<4;i++) document.getElementById("dd"+i).classList.toggle("filled", i < D.pin.length);
}

async function verifyPin(autoPin) {
  if (isLocked()) return;
  if (!autoPin) {
     document.getElementById("dErr").textContent = "Logging you in...";
     pinAuthInProgress = true;
     sLoading(true, "Logging you in...");
  }
  
  const pinToVerify = autoPin || D.pin;
  try {
    const today = todayIST();
    const res   = await fetchWithTimeout(`${APPS_SCRIPT_URL}?action=getDriverOrders&date=${today}&pin=${pinToVerify}&_t=${Date.now()}`);
    const data  = await res.json();
    if (data.error) {
      if (!autoPin) {
        attempts++;
        if (attempts >= 5) {
          lockoutEnd = Date.now() + 60000;
          document.getElementById("dErr").textContent = "Too many attempts. Wait 60s.";
        } else {
          document.getElementById("dErr").textContent = "Incorrect PIN — Please try again";
        }
        D.pin = ""; renderDots();
      } else {
        localStorage.removeItem('sk-driver-pin');
      }
      return;
    }
    attempts = 0;
    D.sessionPin = pinToVerify;
    localStorage.setItem('sk-driver-pin', D.sessionPin); 
    D.pin = ""; renderDots();
    document.getElementById("loginWrap").style.display = "none";
    document.getElementById("shell").classList.add("on");
    document.getElementById("datePicker").value = today;
    renderAll(data);
    autoSwitchMeal();
    startPoll();
  } catch(e) {
    D.pin = ""; renderDots();
    if (autoPin) {
      // Auto-login failed (likely GAS cold-start or timeout) — clear saved PIN
      // and prompt driver to enter it manually
      localStorage.removeItem('sk-driver-pin');
      document.getElementById("dErr").textContent = "Auto-login failed — please enter PIN manually";
    } else {
      attempts++;
      if (attempts >= 5) {
        lockoutEnd = Date.now() + 60000;
        document.getElementById("dErr").textContent = "Too many attempts. Wait 60s.";
      } else {
        document.getElementById("dErr").textContent = e.name === 'AbortError'
          ? "Connection timed out — please try again"
          : "Incorrect PIN — Please try again";
      }
    }
  } finally {
    pinAuthInProgress = false;
    sLoading(false);
  }
}

async function logout() {
  if (!await sConfirm("Are you sure you want to logout?", "Logout", "🔐")) return;
  localStorage.removeItem('sk-driver-pin');
  window.location.reload();
}

function todayIST() {
  return new Date(new Date().getTime() + 5.5*3600000).toISOString().slice(0,10);
}
function autoSwitchMeal() {
  const h = new Date(new Date().getTime() + 5.5*3600000).getUTCHours();
  if (h < 10) switchTab("Breakfast");
  else if (h < 15) switchTab("Lunch");
  else switchTab("Dinner");
}

// ── LOAD ──────────────────────────────────────────────────────────────────────
async function loadOrders() {
  const date = document.getElementById("datePicker").value;
  if (!date) return;
  sLoading(true, "Fetching data...");
  ["Breakfast","Lunch","Dinner"].forEach(m => {
    document.getElementById("panel_"+m).innerHTML = `<div class="spinner"></div>`;
  });
  try {
    // Fetch orders + the learned delivery route together.
    const [res, routeRes] = await Promise.all([
      fetchWithTimeout(`${APPS_SCRIPT_URL}?action=getDriverOrders&date=${date}&pin=${D.sessionPin}&_t=${Date.now()}`),
      fetch(`${APPS_SCRIPT_URL}?action=getDeliveryRoute&pin=${D.sessionPin}&_t=${Date.now()}`).catch(() => null)
    ]);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    if (routeRes) {
      try {
        const rd = await routeRes.json();
        if (rd && rd.success) { _deliveryRoute = rd.route || {}; _routeUpdated = rd.updated || ""; }
      } catch (e) {}
    }
    updateRouteStatus();
    updateSortToggleUI();
    renderAll(data);
    setSyncBadge();
    stopPoll(); startPoll();
  } catch(e) {
    ["Breakfast","Lunch","Dinner"].forEach(m => {
      document.getElementById("panel_"+m).innerHTML =
        `<div class="empty"><div class="empty-icon">⚠️</div>${e.message}</div>`;
    });
  } finally {
    sLoading(false);
  }
}

// ── AUTO-POLL (delivery status sync every 5m) ────────────────────────────────
function startPoll()  { stopPoll(); _pollTimer = setInterval(silentPoll, 300000); }
function stopPoll()   { if (_pollTimer) clearInterval(_pollTimer); }

async function silentPoll() {
  const date = document.getElementById("datePicker").value;
  if (!date || !D.sessionPin) return;
  try {
    const res  = await fetch(`${APPS_SCRIPT_URL}?action=getDriverOrders&date=${date}&pin=${D.sessionPin}&_t=${Date.now()}`);
    const data = await res.json();
    if (data.error) return;
    // Only update delivery badges — don't re-render cards
    let anyUpdate = false;
    ["Breakfast","Lunch","Dinner"].forEach(meal => {
      (data.meals[meal] || []).forEach(o => {
        if (!o.submissionId) return;
        const btn  = document.getElementById("dbtn_"+o.submissionId);
        const card = document.getElementById("dcard_"+o.submissionId);
        if (o.deliveredAt && btn && !btn.classList.contains("done")) {
          btn.className = "btn-delivered done";
          btn.innerHTML = `✅ Delivered at ${fmtTime(o.deliveredAt)}`;
          if (card) { card.classList.add("delivered"); }
          const tBadge = document.getElementById("dtag_"+o.submissionId);
          if (tBadge) { tBadge.style.display=""; tBadge.textContent = `✅ ${fmtTime(o.deliveredAt)}`; }
          // Update local data + push to bottom
          const local = (_ordersData[meal]||[]).find(lo=>lo.submissionId===o.submissionId);
          if (local && !local.deliveredAt) {
            local.deliveredAt = o.deliveredAt;
            setTimeout(()=>{ const panel=document.getElementById("panel_"+meal); if(card&&panel)panel.appendChild(card); }, 300);
            anyUpdate = true;
          }
        }
      });
      if (anyUpdate) updateProgress(meal);
    });
    setSyncBadge();
  } catch(e) {}
}

function setSyncBadge() {
  const now = new Date(new Date().getTime() + 5.5*3600000);
  document.getElementById("syncBadge").textContent =
    `Synced ${now.getUTCHours()}:${String(now.getUTCMinutes()).padStart(2,"0")}`;
}

// ── SORT MODE TOGGLE ────────────────────────────────────────────────────────
function setSortMode(mode) {
  _sortMode = (mode === "name") ? "name" : "route";
  localStorage.setItem("sk_driver_sort", _sortMode);
  updateSortToggleUI();
  if (_lastData) renderAll(_lastData);
}

function updateSortToggleUI() {
  const on  = "background:#fff;color:#1a8c4a;";
  const off = "background:none;color:#fff;";
  const r = document.getElementById("sortBtnRoute");
  const n = document.getElementById("sortBtnName");
  if (r) r.style.cssText = "border:none;font-size:0.68rem;font-weight:700;padding:4px 12px;cursor:pointer;" + (_sortMode === "route" ? on : off);
  if (n) n.style.cssText = "border:none;font-size:0.68rem;font-weight:700;padding:4px 12px;cursor:pointer;" + (_sortMode === "name" ? on : off);

// ── DELIVERY ROUTE ──────────────────────────────────────────────────────────
function updateRouteStatus() {
  const el = document.getElementById("routeStatus");
  if (!el) return;
  const buildings = Object.keys((_deliveryRoute && _deliveryRoute.Lunch) || {}).length
                 || Object.keys((_deliveryRoute && _deliveryRoute.Dinner) || {}).length;
  el.textContent = _routeUpdated
    ? `🧭 Route: ${buildings} building(s) · learned ${_routeUpdated}`
    : `🧭 Route: not learned yet — tap "Optimize route" after a few days of deliveries`;
}

async function rebuildRoute() {
  if (!confirm("Re-learn the delivery route from the last 30 days of your delivered orders?\n\nThis reads the order in which you marked deliveries and sorts each meal's stops by building. You can run this anytime.")) return;
  sLoading(true, "Learning route from last 30 days…");
  try {
    const res  = await fetchWithTimeout(`${APPS_SCRIPT_URL}?action=buildDeliveryRoute&days=30&pin=${D.sessionPin}&_t=${Date.now()}`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "Could not build route");
    alert(`✅ Route updated — ${data.count} building-stops learned across meals.\nReloading the list in route order.`);
    await loadOrders();
  } catch (e) {
    alert("⚠️ " + e.message);
  } finally {
    sLoading(false);
  }
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderAll(data) {
  _lastData = data; // remember for re-render when the sort toggle changes
  ["Breakfast","Lunch","Dinner"].forEach(meal => {
    const raw = ((data.meals || {})[meal] || []);
    // Undelivered (top) sort depends on the driver's chosen mode:
    //   "route" → learned building order (society grouped in his preferred stop
    //             sequence; unknown buildings sink to bottom; within: wing→flat→name)
    //   "name"  → simple A–Z by customer name (helpful early, before route is learned)
    // Delivered (bottom): always by time delivered (oldest→newest) — a running log.
    const routeMap = _deliveryRoute[meal] || {};
    const socKey = (o) => String(o.society || o.area || "").trim().toLowerCase().replace(/\s+/g, " ");
    const routeRank = (o) => {
      const r = routeMap[socKey(o)];
      return (typeof r === "number" && r > 0) ? r : 9999; // unknown → bottom
    };
    const byName = (a, b) => String(a.name || "").localeCompare(String(b.name || ""), undefined, { sensitivity: "base" });
    const byRoute = (a, b) => {
      const ra = routeRank(a), rb = routeRank(b);
      if (ra !== rb) return ra - rb;
      // Tie → keep buildings together (alphabetical society), then wing/flat/name.
      const sa = socKey(a), sb = socKey(b);
      if (sa !== sb) return sa.localeCompare(sb);
      const wa = String(a.wing || "").toLowerCase(), wb = String(b.wing || "").toLowerCase();
      if (wa !== wb) return wa.localeCompare(wb);
      const fa = parseInt(a.flat, 10) || 0, fb = parseInt(b.flat, 10) || 0;
      if (fa !== fb) return fa - fb;
      return byName(a, b);
    };
    const byDeliveredTime = (a, b) => {
      const ta = a.deliveredAt ? new Date(a.deliveredAt).getTime() : 0;
      const tb = b.deliveredAt ? new Date(b.deliveredAt).getTime() : 0;
      return ta - tb;
    };
    const undeliveredSort = (_sortMode === "name") ? byName : byRoute;
    const orders = [
      ...raw.filter(o => !o.deliveredAt).sort(undeliveredSort),
      ...raw.filter(o => o.deliveredAt).sort(byDeliveredTime)
    ];
    _ordersData[meal] = orders;
    document.getElementById("cnt_"+meal).textContent = orders.length;
    document.getElementById("panel_"+meal).innerHTML = renderMealPanel(orders, meal);
    // Re-apply any active search query for this meal after re-render.
    applyDriverSearch(meal);
  });
  // Show progress for the currently active tab
  const activeMeal = ["Breakfast","Lunch","Dinner"].find(m =>
    document.getElementById("tab_"+m).classList.contains("active")) || "Breakfast";
  updateProgress(activeMeal);
}

function updateProgress(meal) {
  const orders = _ordersData[meal] || [];
  const total  = orders.length;
  const done   = orders.filter(o => o.deliveredAt).length;
  const strip  = document.getElementById("progressStrip");
  const fill   = document.getElementById("progressFill");
  const text   = document.getElementById("progressText");
  if (!total) { strip.style.display = "none"; return; }
  strip.style.display = "flex";
  const pct = Math.round(done/total*100);
  fill.style.width  = pct + "%";
  text.textContent  = `${done} / ${total} delivered`;
  text.className    = "progress-text" + (done===total ? " done" : "");
  // Tab count shows remaining
  const remaining = total - done;
  document.getElementById("cnt_"+meal).textContent = remaining > 0 ? remaining : "✓";
  // Cash badge logic removed
  // Check if all done
  if (done === total && total > 0) checkAllDone(meal);
}

function checkAllDone(meal) {
  const orders   = _ordersData[meal] || [];
  const total    = orders.length;
  // Audit Fix #1: Define km from _routeDists to prevent ReferenceError
  const km = _routeDists[meal] || null;
  document.getElementById("doneStats").innerHTML = `
    <div class="done-stat"><div class="done-stat-val">${total}</div><div class="done-stat-lbl">Deliveries Completed</div></div>
    ${km ? `<div class="done-stat"><div class="done-stat-val">~${km} km</div><div class="done-stat-lbl">Estimated Route</div></div>` : ""}
    <div class="done-stat"><div class="done-stat-val">${fmtTime(new Date().toISOString())}</div><div class="done-stat-lbl">Finished At</div></div>
  `;
  document.getElementById("allDoneOverlay").style.display = "flex";
}

function renderMealPanel(orders, meal) {
  if (!orders.length) {
    return `<div class="empty"><div class="empty-icon">😴</div>No deliveries for ${meal}</div>`;
  }

  const selectedDate = document.getElementById("datePicker").value;
  const localEnRouteKey = `sk_enroute_${selectedDate}_${meal}`;
  const isLocallyEnRoute = localStorage.getItem(localEnRouteKey) === 'true';

  // Apply persistence override immediately
  if (isLocallyEnRoute) {
    orders.forEach(o => { if (!o.deliveredAt) o.enRouteAt = o.enRouteAt || new Date().toISOString(); });
  }

  // Count geocodable orders for route button
  const canOptimize = orders.some(o => extractCoords(o));

  const today = todayIST();
  const nowRaw = new Date(new Date().getTime() + 5.5*3600000);
  const hour = nowRaw.getUTCHours() + nowRaw.getUTCMinutes()/60;
  
  const SLOT_TIMES = { Breakfast: 7.5, Lunch: 10, Dinner: 17.5 }; // 07:30, 10:00, 17:30
  const isToday = (selectedDate === today);
  const timeReached = hour >= (SLOT_TIMES[meal] || 0);
  const canStart = isToday && timeReached;
  
  // Detect if delivery trip already started for this meal (now includes localStorage check)
  const isEnRoute = orders.some(o => o.enRouteAt);
  
  const fmtSlotTime = (t) => {
    const h = Math.floor(t), m = (t % 1) * 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`;
  };

  const statusMsg = !isToday ? "Future delivery cannot be started" : 
                    (!timeReached ? `Opening at ${fmtSlotTime(SLOT_TIMES[meal])}` : "");

  // Determine Button State
  let btnClass = canStart ? 'green' : '';
  let btnText = canStart ? `🚀 Start ${meal} Delivery` : `🔒 ${meal} Locked`;
  let btnAttr = !canStart ? 'disabled style="background:#888;box-shadow:none;opacity:0.6;"' : 'style="padding:10px 14px;font-size:0.85rem;box-shadow:0 3px 10px rgba(39,174,96,0.3);"';

  if (isEnRoute) {
    btnClass = "green done";
    btnText = `🚗 ${meal} Out for Delivery`;
    btnAttr = 'disabled style="padding:10px 14px;font-size:0.85rem;box-shadow:none;opacity:0.8;"';
  }

  // Per-meal search bar — scoped to this meal only so searching in Lunch
  // never reaches Breakfast/Dinner cards (those panels are hidden anyway).
  // The handler hides any .order-card whose data-search doesn't contain the
  // query; clearing the input shows everything again.
  const prevQuery = (_searchQuery && _searchQuery[meal]) || "";
  const searchBar = `<div class="driver-search-bar" style="padding:10px 12px 0;background:#fff;">
    <div style="position:relative;">
      <input type="search" id="search_${meal}" placeholder="🔍 Search customer name…" value="${prevQuery.replace(/"/g,'&quot;')}"
             oninput="applyDriverSearch('${meal}', this.value)"
             style="width:100%;padding:8px 32px 8px 12px;font-size:0.85rem;border:1.5px solid #ddd;border-radius:10px;font-family:inherit;box-sizing:border-box;background:#fafafa;">
      ${prevQuery ? `<button type="button" onclick="clearDriverSearch('${meal}')" aria-label="Clear" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;color:#888;padding:4px 8px;">✕</button>` : ""}
    </div>
    <div id="searchMeta_${meal}" style="font-size:0.7rem;color:#888;margin-top:4px;min-height:14px;"></div>
  </div>`;

  const routeBar = `<div class="route-bar" id="routeBar_${meal}" style="border-bottom:2.5px solid #1E1240;">
    <button class="route-btn ${btnClass}" 
            onclick="markAllEnRoute('${meal}')" 
            id="startBtn_${meal}" 
            ${btnAttr}>
      ${btnText}
    </button>
    ${(!isEnRoute && statusMsg) ? `<span style="font-size:0.7rem;color:#1E1240;font-weight:700;margin-left:4px;">${statusMsg}</span>` : ""}
    ${canOptimize
      ? `<button class="route-btn" onclick="optimizeRoute('${meal}')">🗺 Optimize Route</button>`
      : ""}
    <span class="route-info" id="routeInfo_${meal}"></span>
    <a id="routeLink_${meal}" class="route-maps-link" style="display:none;" target="_blank">📍 Open in Maps</a>
    <a href="https://www.google.com/maps/search/?api=1&query=${KITCHEN.lat},${KITCHEN.lng}"
       target="_blank"
       style="font-size:0.62rem;color:#888;text-decoration:none;margin-left:auto;"
       title="Verify kitchen start/end point">🏠 Kitchen pin</a>
  </div>`;

  return searchBar + routeBar + orders.map((o, i) => renderCard(o, i, meal)).join("");
}

function renderCard(o, i, meal) {
  const hasMap      = o.maps && o.maps.startsWith("http");
  const hasPhone    = o.phone && o.phone.length >= 10;
  const isDelivered = !!o.deliveredAt;
  const waText      = encodeURIComponent(`✅ Hi ${o.name}! Your ${meal} has been delivered. Thank you! 🙏`);
  const waNum       = hasPhone ? "91" + o.phone.replace(/\D/g,"").slice(-10) : "";

  // ── DYNAMIC ADDRESS OVERRIDE ──
  let displayArea = o.area || "";
  let displayAddr = o.address || "";
  let displayLandmark = o.landmark || "";
  
  if (o.mealAddresses) {
    try {
      const ma = JSON.parse(o.mealAddresses);
      const mData = ma[meal];
      if (mData && mData.area) {
        displayArea = mData.area;
        if (displayArea.toLowerCase().includes("pickup")) {
          // If profile says pickup, ensure it shows as pickup
        } else {
          // Use profile address components if it's a specific delivery location
          const parts = [
            mData.wing ? `Wing ${mData.wing}` : "",
            mData.flat ? `Flat ${mData.flat}` : "",
            mData.floor ? `${mData.floor} Floor` : "",
            mData.society || "",
            mData.area || ""
          ].filter(Boolean);
          displayAddr = parts.join(", ");
          displayLandmark = mData.landmark || "";
        }
      }
    } catch(e) { console.warn("Error parsing mealAddresses override", e); }
  }
  const isPickup = displayArea.toLowerCase().includes("pickup");

  return `<div class="order-card${isDelivered?" delivered":""}" id="dcard_${o.submissionId}" data-meal="${meal}" data-search="${String(o.name||"").toLowerCase().replace(/"/g,'&quot;')}">
    <div class="order-header">
      <div class="order-num">DELIVERY #${i+1}</div>
      ${isDelivered
        ? `<div class="delivered-time" id="dtag_${o.submissionId}">✅ ${fmtTime(o.deliveredAt)}</div>`
        : `<div class="delivered-time" id="dtag_${o.submissionId}" style="display:none;"></div>`}
    </div>
    <div class="cust-name">${o.name || "—"}</div>
    <div class="cust-phone">${hasPhone ? "📞 "+o.phone : ""}</div>
    <div class="address-box">
      ${isPickup 
        ? `<div style="color:#d32f2f; font-size:1.1rem; font-weight:800; display:flex; align-items:center; gap:6px; margin-bottom:4px;">🏠 SELF PICKUP</div><div style="font-size:0.8rem; color:#666;">Customer set "${displayArea}" in profile</div>`
        : `📍 ${displayAddr || "Address not available"}
          ${displayArea ? `<br><span style="color:#888;font-size:0.72rem;">📌 ${displayArea}</span>` : ""}
          ${displayLandmark ? `<div class="landmark">🏢 Landmark: <span>${displayLandmark}</span></div>` : ""}`
      }
    </div>
    
    <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:12px;">
      <div style="background:#e3f2fd; border-radius:10px; padding:10px 14px; font-size:0.85rem; color:#1565c0; font-weight:700; border: 1px solid #bbdefb; display:flex; align-items:center; gap:8px;">
        <span>🚚</span> <span>Instruction : ${o.deliveryPoint || "Handover at Doorstep"}</span>
      </div>
      ${o.notes ? `<div class="notes-box" style="margin-bottom:0; padding:10px 14px; font-size:0.85rem; border: 1px solid #ffe082;">📝 Special instructions for driver staff (optional): ${o.notes}</div>` : ""}
    </div>

    <div class="card-actions">
      ${hasPhone
        ? `<a class="btn-call" href="tel:${o.phone}">📞 Call</a>`
        : `<span class="btn-call" style="background:#ccc;pointer-events:none;">No number</span>`}
      ${(hasMap && !isPickup)
        ? `<a class="btn-maps" href="${o.maps}" target="_blank">🗺 Maps</a>`
        : `<span class="btn-maps disabled">No map</span>`}
      ${hasPhone
        ? `<a class="btn-whatsapp" href="https://wa.me/${waNum}?text=${waText}" target="_blank">💬</a>`
        : ""}
    </div>
    ${(() => {
       const c = extractCoords(o);
       if (!c) return `<div style="margin-top:6px;font-size:0.65rem;color:#c0392b;">⚠️ No coordinates extracted — this stop will be skipped during route optimization</div>`;
       return `<div style="margin-top:6px;font-size:0.65rem;color:#888;">
         📍 Pin used:
         <a href="https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}" target="_blank"
            style="color:#1a73e8;text-decoration:none;font-weight:600;">${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}</a>
       </div>`;
     })()}
    <div style="margin-top:10px;">
      <button class="btn-delivered${isDelivered?" done":""}" 
        style="width:100%;margin-top:0;padding:14px;font-size:1rem;${(!o.enRouteAt && !isDelivered) ? 'opacity:0.5; cursor:not-allowed;' : ''}" 
        id="dbtn_${o.submissionId}"
        onclick="markDelivered('${o.submissionId}','${meal}',this)"
        ${(isDelivered || !o.enRouteAt) ? "disabled" : ""}>
        ${o.enRouteAt && !isDelivered ? `<span style="float:left;">🚗</span>` : ""}
        ${isDelivered ? `✅ Delivered at ${fmtTime(o.deliveredAt)}` : (!o.enRouteAt ? "🔒 Start Delivery to Unlock" : "⬜ Mark Delivered")}
      </button>
    </div>
  </div>`;
}

// ── OFFLINE DELIVERY QUEUE ───────────────────────────────────────────────────
// If markDelivered fails (no signal), we queue it in localStorage and flush later.
const _OFFLINE_KEY = "sk_driver_offline_queue";

function _queueDelivery(submissionId, meal, deliveredAt) {
  let q = [];
  try { q = JSON.parse(localStorage.getItem(_OFFLINE_KEY) || "[]"); } catch(e) {}
  // Deduplicate by submissionId
  if (!q.find(x => x.submissionId === submissionId)) {
    q.push({ submissionId, meal, deliveredAt, pin: D.sessionPin });
    localStorage.setItem(_OFFLINE_KEY, JSON.stringify(q));
    _showOfflineBadge(q.length);
  }
}
function _showOfflineBadge(count) {
  let badge = document.getElementById("offlineQueueBadge");
  if (!badge) {
    badge = document.createElement("div");
    badge.id = "offlineQueueBadge";
    badge.onclick = _flushOfflineQueue;
    badge.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#e67e22;color:#fff;font-size:0.78rem;font-weight:700;padding:8px 16px;border-radius:20px;cursor:pointer;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.3);";
    document.body.appendChild(badge);
  }
  badge.textContent = `⚠️ ${count} delivery offline — tap to sync`;
  badge.style.display = count > 0 ? "block" : "none";
}

async function _flushOfflineQueue() {
  let q = [];
  try { q = JSON.parse(localStorage.getItem(_OFFLINE_KEY) || "[]"); } catch(e) {}
  if (!q.length) return;
  let flushed = 0;
  const remaining = [];
  for (const item of q) {
    try {
      const res  = await fetch(APPS_SCRIPT_URL, {method:"POST",
        body: JSON.stringify({_action:"markDelivered", pin: item.pin || D.sessionPin, submissionId: item.submissionId, deliveredAt: item.deliveredAt})});
      const data = await res.json();
      if (data.success) {
        flushed++;
        // Update UI if card still visible
        const btn = document.getElementById("dbtn_"+item.submissionId);
        if (btn && !btn.classList.contains("done")) {
          btn.className = "btn-delivered done";
          btn.innerHTML = `✅ Delivered at ${fmtTime(item.deliveredAt)}`;
        }
        const card = document.getElementById("dcard_"+item.submissionId);
        if (card) card.classList.add("delivered");
      } else { remaining.push(item); }
    } catch(e) { remaining.push(item); }
  }
  localStorage.setItem(_OFFLINE_KEY, JSON.stringify(remaining));
  _showOfflineBadge(remaining.length);
  if (flushed) silentPoll(); // refresh delivery counts
}

// Flush queue on connectivity restored or tab becomes visible
window.addEventListener("online", _flushOfflineQueue);
document.addEventListener("visibilitychange", () => { if (!document.hidden && navigator.onLine) _flushOfflineQueue(); });

// Check on load for any pending offline items
window.addEventListener("load", () => {
  try {
    const q = JSON.parse(localStorage.getItem(_OFFLINE_KEY) || "[]");
    if (q.length) _showOfflineBadge(q.length);
  } catch(e) {}
});

// ── MARK DELIVERED ────────────────────────────────────────────────────────────
async function markDelivered(submissionId, meal, btn) {
  if (!submissionId || btn.classList.contains("done")) return;
  sBtnLoading(btn, true, "Marking");
  const deliveredAt = new Date().toISOString(); // proper UTC — fmtTime adds +5:30 for display

  // Optimistically update UI immediately for better field UX
  btn.className = "btn-delivered done";
  btn.innerHTML = `✅ Delivered at ${fmtTime(deliveredAt)}`;
  const card = document.getElementById("dcard_"+submissionId);
  if (card) card.classList.add("delivered");
  const tag = document.getElementById("dtag_"+submissionId);
  if (tag) { tag.style.display=""; tag.textContent = `✅ ${fmtTime(deliveredAt)}`; }
  const order = (_ordersData[meal]||[]).find(o=>o.submissionId===submissionId);
  if (order) order.deliveredAt = deliveredAt;
  updateProgress(meal);
  setTimeout(() => { const panel = document.getElementById("panel_"+meal); if (card && panel) panel.appendChild(card); }, 500);

  try {
    const res  = await fetch(APPS_SCRIPT_URL, {method:"POST",
      body: JSON.stringify({_action:"markDelivered", pin:D.sessionPin, submissionId, deliveredAt})});
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "Failed");
    // Success — clear any stale offline queue entry for this order
    try {
      let q = JSON.parse(localStorage.getItem(_OFFLINE_KEY) || "[]");
      q = q.filter(x => x.submissionId !== submissionId);
      localStorage.setItem(_OFFLINE_KEY, JSON.stringify(q));
      _showOfflineBadge(q.length);
    } catch(e) {}
  } catch(e) {
    // Network failure — queue for later sync
    _queueDelivery(submissionId, meal, deliveredAt);
  }
}

async function markAllEnRoute(meal) {
  const orders = _ordersData[meal] || [];
  if (!orders.length) return;
  const count = orders.filter(o => !o.enRouteAt && !o.deliveredAt).length;
  if (count === 0) { await sAlert("All orders for " + meal + " are already marked as out for delivery!", "Notice", "ℹ️"); return; }

  if (!await sConfirm(`Mark all ${count} ${meal} orders as 'Out for Delivery'?\n\nThis will notify customers that their food is on the way!`, "Start Delivery", "🚀")) return;

  const btn = document.getElementById("startBtn_" + meal);
  sBtnLoading(btn, true, "Sending notifications");
  
  const enRouteAt = new Date().toISOString();
  const submissionIds = orders.filter(o => !o.enRouteAt && !o.deliveredAt).map(o => o.submissionId);

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        _action: "batchMarkEnRoute",
        pin: D.sessionPin,
        submissionIds: submissionIds,
        enRouteAt: enRouteAt
      })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "Failed to update");

    // Update local data
    orders.forEach(o => {
      if (submissionIds.includes(o.submissionId)) o.enRouteAt = enRouteAt;
    });

    // Persist Started state
    const selectedDate = document.getElementById("datePicker").value;
    localStorage.setItem(`sk_enroute_${selectedDate}_${meal}`, 'true');

    btn.className = "route-btn green done";
    btn.innerHTML = `🚗 ${meal} Out for Delivery`;
    
    // Refresh the UI cards to unlock the "Mark Delivered" buttons
    document.getElementById("panel_" + meal).innerHTML = renderMealPanel(orders, meal);
    switchTab(meal);
    await sAlert(`Success! ${submissionIds.length} orders marked as Out for Delivery.`, "Delivery Started", "✅");
  } catch (err) {
    sBtnLoading(btn, false);
    await sAlert("Error: " + err.message, "Batch Update Failed", "❌");
  }
}

function fmtTime(isoStr) {
  if (!isoStr) return "";
  try {
    // Always treat stored value as UTC and convert to IST (+5:30)
    const ist = new Date(new Date(isoStr).getTime() + 5.5*3600000);
    const h = ist.getUTCHours(), m = ist.getUTCMinutes();
    return `${h}:${String(m).padStart(2,"0")}`;
  } catch(e) { return isoStr.slice(11,16); }
}

// ── ROUTE OPTIMISATION ────────────────────────────────────────────────────────
// Server resolves lat/lng for every order (short links + pin coords). The fallback
// regex below matches the same priority order as the server in case the server
// could not resolve. Priority: !3d/!4d (actual pin) > /place/@ > ?q= / ?destination=
// > ?ll= > @ (camera center, last resort).
function extractCoords(o) {
  if (!o) return null;
  if (o.lat && o.lng) return { lat: +o.lat, lng: +o.lng };
  let url = o.maps || "";
  if (!url) return null;
  try { url = decodeURIComponent(url); } catch(_) {}

  let m = url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if (m) return { lat: +m[1], lng: +m[2] };

  m = url.match(/\/place\/[^/]+\/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) return { lat: +m[1], lng: +m[2] };

  m = url.match(/[?&](?:q|query|destination|daddr|saddr)=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) return { lat: +m[1], lng: +m[2] };

  m = url.match(/[?&]ll=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) return { lat: +m[1], lng: +m[2] };

  m = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) return { lat: +m[1], lng: +m[2] };

  return null;
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function nearestNeighbor(orders) {
  const undelivered = orders.filter(o => !o.deliveredAt);
  const delivered   = orders.filter(o => o.deliveredAt);
  
  const withC = undelivered.map(o => ({...o, _c: extractCoords(o)}));
  const geo   = withC.filter(o => o._c);
  const noGeo = withC.filter(o => !o._c);
  if (!geo.length) return { route: orders, dist: null };

  const result = [], remaining = [...geo];
  let cur = KITCHEN;
  while (remaining.length) {
    let minD = Infinity, minI = 0;
    remaining.forEach((o,i) => {
      const d = haversine(cur.lat, cur.lng, o._c.lat, o._c.lng);
      if (d < minD) { minD = d; minI = i; }
    });
    result.push(remaining[minI]);
    cur = remaining[minI]._c;
    remaining.splice(minI, 1);
  }

  // Total round-trip distance
  let dist = 0, prev = KITCHEN;
  result.forEach(o => { dist += haversine(prev.lat, prev.lng, o._c.lat, o._c.lng); prev = o._c; });
  dist += haversine(prev.lat, prev.lng, KITCHEN.lat, KITCHEN.lng);

  return { route: [...result, ...noGeo, ...delivered], dist: Math.round(dist*10)/10 };
}

function buildMapsUrl(orders) {
  // Use the official Directions API URL format — this respects the order of
  // waypoints we pass and disables Google's auto-optimisation (we already
  // ran nearest-neighbor client-side). Round trip: kitchen → stops → kitchen.
  const stops = orders.filter(o => o._c).map(o => `${o._c.lat},${o._c.lng}`);
  if (!stops.length) return null;
  const K = `${KITCHEN.lat},${KITCHEN.lng}`;

  // Google Maps directions URL caps practical waypoint count around 9; if more,
  // we still include them but the customer/driver may need to split.
  const params = new URLSearchParams({
    api:           "1",
    origin:        K,
    destination:   K,
    travelmode:    "driving",
    waypoints:     stops.join("|")
  });
  return `https://www.google.com/maps/dir/?${params.toString()}`;
}

function optimizeRoute(meal) {
  const orders = _ordersData[meal];
  if (!orders || !orders.length) return;

  const { route, dist } = nearestNeighbor(orders);
  _ordersData[meal] = route;
  if (dist) _routeDists[meal] = dist; // save for end-of-day summary

  // Re-number and re-render cards only (keep route bar)
  const cardsHtml = route.map((o,i) => renderCard(o, i, meal)).join("");
  // Replace cards after the route-bar div
  const panel = document.getElementById("panel_"+meal);
  const routeBar = document.getElementById("routeBar_"+meal);
  // Remove all children except routeBar
  [...panel.children].forEach(el => { if (el !== routeBar) el.remove(); });
  panel.insertAdjacentHTML("beforeend", cardsHtml);

  // Update route info
  const infoEl = document.getElementById("routeInfo_"+meal);
  if (infoEl) infoEl.innerHTML = `<span style="color:#27ae60;font-weight:600;">✅ Optimised${dist ? " · ~"+dist+" km" : ""}</span>`;

  // Show Maps link
  const mapsUrl = buildMapsUrl(route);
  const linkEl  = document.getElementById("routeLink_"+meal);
  if (linkEl && mapsUrl) { linkEl.href = mapsUrl; linkEl.style.display = "block"; }
}

// ── TABS ──────────────────────────────────────────────────────────────────────
function switchTab(meal) {
  ["Breakfast","Lunch","Dinner"].forEach(m => {
    document.getElementById("tab_"+m).classList.toggle("active", m===meal);
    document.getElementById("panel_"+m).classList.toggle("active", m===meal);
  });
  updateProgress(meal);
}

document.getElementById("datePicker").value = todayIST();

// ── SCREEN WAKE LOCK ──
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      updateWakeStatus(true);
      wakeLock.addEventListener('release', () => updateWakeStatus(false));
    }
  } catch (err) { updateWakeStatus(false); }
}

function updateWakeStatus(active) {
  const el = document.getElementById("wakeStatus");
  if (!el) return;
  if (active) {
    el.textContent = "⚡ Wake: On";
    el.classList.add("active");
  } else {
    el.textContent = "⚡ Wake: Off (Click)";
    el.classList.remove("active");
  }
}

document.addEventListener('click', () => {
  if (!wakeLock) requestWakeLock();
}, { once: true });

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});

// Auto-Login
window.onload = () => {
  requestWakeLock();
  const saved = localStorage.getItem('sk-driver-pin');
  if (saved && saved.length === 4) {
    verifyPin(saved);
  }
};

// ── EXPORT DELIVERY SHEET ────────────────────────────────────────────────────
function _defaultExportMeal() {
  // Use IST time (UTC+5:30) to pick the most relevant meal
  const nowUtc  = new Date();
  const istHour = (nowUtc.getUTCHours() + 5) + (nowUtc.getUTCMinutes() + 30) / 60;
  // before 08:00 IST → Breakfast | before 14:00 IST → Lunch | else → Dinner
  if (istHour < 8)   return "Breakfast";
  if (istHour < 14)  return "Lunch";
  return "Dinner";
}

function openExportModal() {
  // Default: today's date + time-based meal; user can override
  const todayIST = (() => {
    const d = new Date();
    d.setMinutes(d.getMinutes() + d.getTimezoneOffset() + 330); // shift to IST
    return d.toISOString().slice(0, 10);
  })();
  document.getElementById("exportDate").value = todayIST;
  document.getElementById("exportMeal").value = _defaultExportMeal();
  document.getElementById("exportModal").style.display = "flex";
}

function closeExportModal() {
  document.getElementById("exportModal").style.display = "none";
}

async function confirmExport() {
  const date = document.getElementById("exportDate").value;
  const meal = document.getElementById("exportMeal").value;
  if (!date) { alert("Please select a date."); return; }

  closeExportModal();
  sLoading(true, "Creating Google Sheet…");

  try {
    const res  = await fetch(`${APPS_SCRIPT_URL}?action=createDeliverySheet&date=${date}&meal=${encodeURIComponent(meal)}&pin=${D.sessionPin}&_t=${Date.now()}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    if (!data.count) { alert(`No orders found for ${meal} on ${date}.`); return; }
    window.open(data.url, "_blank");
  } catch(e) {
    alert("Could not create sheet: " + e.message);
  } finally {
    sLoading(false);
  }
}

</script>
