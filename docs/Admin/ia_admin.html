<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IntentAmplify Admin</title>
<link rel="icon" type="image/x-icon" href="../images/svaadh-kitchen-hero.PNG">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#222;min-height:100vh;}

  #loginWrap{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:100;}
  .login-box{padding:32px 24px;width:100%;max-width:320px;text-align:center;}
  .login-logo{font-size:2rem;margin-bottom:4px;}
  .login-box h1{font-size:1.2rem;font-weight:700;color:#1E1240;margin-bottom:2px;}
  .login-box p{font-size:.78rem;color:#999;margin-bottom:24px;}
  .pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:24px;}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #ddd;transition:all .15s;}
  .pin-dot.filled{background:#1E1240;border-color:#1E1240;}
  .pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto;}
  .pk{background:#f5f5f5;border:none;color:#222;font-size:1.5rem;font-weight:600;border-radius:14px;padding:16px;cursor:pointer;}
  .pk:active{background:#e0e0e0;} .pk.del{color:#999;font-size:1.2rem;} .pk.span2{grid-column:span 2;}
  .login-err{color:#c0392b;font-size:.78rem;margin-top:14px;min-height:18px;}

  #shell{display:none;padding-bottom:50px;} #shell.on{display:block;}
  .topbar{background:#1E1240;color:#fff;padding:10px 14px;position:sticky;top:0;z-index:10;}
  .topbar-row1{display:flex;align-items:center;justify-content:space-between;}
  .topbar-brand{font-size:1rem;font-weight:700;color:#E8C840;}
  .topbar-brand span{color:rgba(255,255,255,.4);font-size:.66rem;margin-left:8px;letter-spacing:1px;text-transform:uppercase;}
  .topbar-nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none;}
  .topbar-nav::-webkit-scrollbar{display:none;}
  .topbar-btn{padding:7px 14px;border-radius:8px;border:none;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .topbar-btn.active{background:rgba(255,255,255,.2);color:#fff;}

  .wrap{padding:14px;max-width:920px;margin:0 auto;}
  .card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:14px;}
  .pane{display:none;} .pane.on{display:block;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  input,select{padding:9px 11px;border:1.5px solid #ddd;border-radius:9px;font-size:.9rem;font-family:inherit;background:#fafafa;}
  input:focus,select:focus{outline:none;border-color:#1E1240;background:#fff;}
  .btn{padding:9px 15px;border:none;border-radius:9px;font-weight:700;cursor:pointer;font-size:.85rem;font-family:inherit;}
  .btn-p{background:#1E1240;color:#fff;} .btn-g{background:#27ae60;color:#fff;} .btn-s{background:#eee;color:#444;} .btn-gold{background:#E8C840;color:#1a1400;}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid #f0f0f0;}
  th{color:#888;font-weight:700;font-size:.72rem;text-transform:uppercase;}
  .pill{padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;}
  .pill.pend{background:#fff3cd;color:#946200;} .pill.paid{background:#d7f5dd;color:#1c7a35;}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;}
  .kpi .b{background:#faf7ff;border:1px solid #ece4fb;border-radius:11px;padding:14px;}
  .kpi .b .v{font-size:1.35rem;font-weight:800;color:#1E1240;} .kpi .b .l{font-size:.72rem;color:#888;margin-top:2px;}
  .mi{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .mi input.nm{flex:1;} .mi input.pr{width:80px;}
  .muted{color:#999;font-size:.82rem;}
  .sectitle{font-size:.95rem;font-weight:700;color:#1E1240;margin-bottom:10px;}
</style>
</head>
<body>

<div id="loginWrap">
  <div class="login-box">
    <div class="login-logo">🛠️</div>
    <h1>IntentAmplify Admin</h1>
    <p>Enter Admin PIN</p>
    <div class="pin-dots">
      <div class="pin-dot" id="ad0"></div><div class="pin-dot" id="ad1"></div>
      <div class="pin-dot" id="ad2"></div><div class="pin-dot" id="ad3"></div>
    </div>
    <div class="pin-grid">
      <button class="pk" onclick="ap(1)">1</button><button class="pk" onclick="ap(2)">2</button><button class="pk" onclick="ap(3)">3</button>
      <button class="pk" onclick="ap(4)">4</button><button class="pk" onclick="ap(5)">5</button><button class="pk" onclick="ap(6)">6</button>
      <button class="pk" onclick="ap(7)">7</button><button class="pk" onclick="ap(8)">8</button><button class="pk" onclick="ap(9)">9</button>
      <button class="pk span2" onclick="ap(0)">0</button><button class="pk del" onclick="ax()">⌫</button>
    </div>
    <div class="login-err" id="aErr"></div>
  </div>
</div>

<div id="shell">
  <div class="topbar">
    <div class="topbar-row1">
      <div class="topbar-brand">IntentAmplify <span>Admin</span></div>
      <button onclick="logout()" style="background:none;border:none;color:#fff;font-size:1.05rem;cursor:pointer;opacity:.8;" title="Logout">🔐</button>
    </div>
    <div class="topbar-nav">
      <button class="topbar-btn active" data-t="menu" onclick="tab('menu')">📋 Set Menu</button>
      <button class="topbar-btn" data-t="appr" onclick="tab('appr')">✅ Approvals</button>
      <button class="topbar-btn" data-t="ord" onclick="tab('ord')">🧾 Orders</button>
      <button class="topbar-btn" data-t="ana" onclick="tab('ana')">📊 Analytics</button>
      <button class="topbar-btn" data-t="cust" onclick="tab('cust')">👥 Customers</button>
    </div>
  </div>

  <div class="wrap">
    <!-- SET MENU -->
    <div class="pane on" id="p-menu">
      <div class="card">
        <div class="sectitle">📋 Set Menu</div>
        <div class="row">
          <input id="mDate" type="date" />
          <select id="mMeal"><option>Lunch</option><option>Dinner</option></select>
          <button class="btn btn-s" onclick="loadMenu()">Load</button>
        </div>
        <div id="menuItems"></div>
        <div class="row" style="margin-top:10px;">
          <button class="btn btn-s" onclick="addItem('','')">+ Add Item</button>
          <button class="btn btn-g" onclick="saveMenu()">Save Menu</button>
        </div>
        <div class="muted">No menu set for a day → the default Lunch/Dinner items apply automatically.</div>
      </div>
    </div>
    <!-- APPROVALS -->
    <div class="pane" id="p-appr">
      <div class="card">
        <div class="row"><div class="sectitle" style="margin:0">✅ Pending Payments</div><button class="btn btn-s" onclick="loadAppr()">Refresh</button></div>
        <table><thead><tr><th>Date</th><th>Meal</th><th>Customer</th><th>Items</th><th>₹</th><th></th></tr></thead><tbody id="apprBody"></tbody></table>
      </div>
    </div>
    <!-- ORDERS -->
    <div class="pane" id="p-ord">
      <div class="card">
        <div class="row"><input id="oFrom" type="date" /><span>→</span><input id="oTo" type="date" /><button class="btn btn-s" onclick="loadOrders()">Load</button></div>
        <table><thead><tr><th>Date</th><th>Meal</th><th>Customer</th><th>Items</th><th>₹</th><th>Status</th></tr></thead><tbody id="ordBody"></tbody></table>
      </div>
    </div>
    <!-- ANALYTICS -->
    <div class="pane" id="p-ana">
      <div class="card">
        <div class="row"><input id="aFrom" type="date" /><span>→</span><input id="aTo" type="date" /><button class="btn btn-s" onclick="loadAna()">Load</button></div>
        <div class="kpi" id="anaKpi"></div>
        <div style="margin-top:14px;"><div class="sectitle">Top items</div><table><tbody id="anaItems"></tbody></table></div>
      </div>
    </div>
    <!-- CUSTOMERS -->
    <div class="pane" id="p-cust">
      <div class="card">
        <div class="row"><div class="sectitle" style="margin:0">👥 Employees</div><button class="btn btn-s" onclick="loadCust()">Refresh</button></div>
        <table><thead><tr><th>Name</th><th>Phone</th><th>Joined</th><th>Last order</th></tr></thead><tbody id="custBody"></tbody></table>
      </div>
    </div>
  </div>
</div>

<script>
  const API="https://script.google.com/macros/s/AKfycbz-wwECc_mSh949babtRt8OAvFbnJJzH5X9JS_PsN-f-IMHeYkQMj54fwXRs6PevK0W/exec";
  const $=id=>document.getElementById(id);
  const today=()=>new Date().toISOString().slice(0,10);
  let A={pin:"",sessionPin:""};

  async function api(action,params){ const u=new URL(API); u.searchParams.set("action",action);
    Object.entries(params||{}).forEach(([k,v])=>{ if(v!=="") u.searchParams.set(k,v); }); const r=await fetch(u); return r.json(); }
  async function post(b){ const r=await fetch(API,{method:"POST",body:JSON.stringify(b)}); return r.json(); }

  function renderDots(){ for(let i=0;i<4;i++) $("ad"+i).classList.toggle("filled", i<A.pin.length); }
  function ap(n){ if(A.pin.length>=4) return; A.pin+=n; renderDots(); if(A.pin.length===4) verifyPin(); }
  function ax(){ A.pin=A.pin.slice(0,-1); renderDots(); $("aErr").textContent=""; }
  async function verifyPin(){
    $("aErr").textContent="Checking…";
    let r; try{ r=await api("ia_pendingApprovals",{pin:A.pin}); }catch(e){ $("aErr").textContent="Network error"; A.pin="";renderDots();return; }
    if(r.error){ $("aErr").textContent="Incorrect PIN — try again"; A.pin="";renderDots();return; }
    A.sessionPin=A.pin; $("loginWrap").style.display="none"; $("shell").classList.add("on"); $("aErr").textContent="";
    $("mDate").value=today(); $("oFrom").value=today(); $("oTo").value=today(); $("aFrom").value=today(); $("aTo").value=today();
    loadMenu();
  }
  function logout(){ A={pin:"",sessionPin:""}; renderDots(); $("shell").classList.remove("on"); $("loginWrap").style.display="flex"; }
  const PIN=()=>A.sessionPin;

  function tab(t){
    document.querySelectorAll(".topbar-btn").forEach(e=>e.classList.toggle("active",e.dataset.t===t));
    document.querySelectorAll(".pane").forEach(e=>e.classList.remove("on"));
    $("p-"+t).classList.add("on");
    if(t==="appr")loadAppr(); if(t==="cust")loadCust();
  }

  // Set Menu
  async function loadMenu(){
    const r=await api("ia_getMenu",{dates:$("mDate").value});
    const info=(r.menu&&r.menu[$("mDate").value]&&r.menu[$("mDate").value][$("mMeal").value])||{items:[]};
    $("menuItems").innerHTML=""; info.items.forEach(it=>addItem(it.name,it.price)); if(!info.items.length) addItem("","");
  }
  function addItem(nm,pr){
    const d=document.createElement("div"); d.className="mi";
    d.innerHTML=`<input class="nm" placeholder="Item name" value="${nm||""}"><input class="pr" type="number" placeholder="₹" value="${pr||""}"><button class="btn btn-s" onclick="this.parentNode.remove()">✕</button>`;
    $("menuItems").appendChild(d);
  }
  async function saveMenu(){
    const items=[...document.querySelectorAll("#menuItems .mi")].map(r=>({name:r.querySelector(".nm").value.trim(),price:Number(r.querySelector(".pr").value)||0,cat:"Item"})).filter(i=>i.name&&i.price>0);
    const res=await post({_action:"ia_setMenu",pin:PIN(),date:$("mDate").value,meal:$("mMeal").value,items_json:JSON.stringify(items)});
    alert(res.success?"Menu saved.":(res.error||"Failed."));
  }
  // Approvals
  async function loadAppr(){
    const r=await api("ia_pendingApprovals",{pin:PIN()}); const b=$("apprBody"); b.innerHTML="";
    (r.orders||[]).forEach(o=>{ const tr=document.createElement("tr");
      tr.innerHTML=`<td>${o.date}</td><td>${o.meal}</td><td>${o.name}<br><span class="muted">${o.phone}</span></td><td class="muted">${o.summary||""}</td><td>₹${o.subtotal}</td><td><button class="btn btn-g">Mark Paid</button></td>`;
      tr.querySelector("button").onclick=async()=>{ const res=await post({_action:"ia_approve",pin:PIN(),submission_id:o.submission_id,date:o.date,meal:o.meal,admin:"admin"}); if(res.success) tr.remove(); else alert(res.error||"Failed."); };
      b.appendChild(tr); });
    if(!b.children.length) b.innerHTML='<tr><td colspan="6" class="muted">No pending payments.</td></tr>';
  }
  // Orders
  async function loadOrders(){
    const r=await api("ia_adminOrders",{pin:PIN(),from:$("oFrom").value,to:$("oTo").value}); const b=$("ordBody"); b.innerHTML="";
    (r.orders||[]).forEach(o=>{ const paid=String(o.payment_status).toLowerCase()==="paid";
      b.innerHTML+=`<tr><td>${o.date}</td><td>${o.meal}</td><td>${o.name}<br><span class="muted">${o.phone}</span></td><td class="muted">${o.summary||""}</td><td>₹${o.subtotal}</td><td><span class="pill ${paid?"paid":"pend"}">${o.payment_status}</span></td></tr>`; });
    if(!b.children.length) b.innerHTML='<tr><td colspan="6" class="muted">No orders.</td></tr>';
  }
  // Analytics
  async function loadAna(){
    const r=await api("ia_analytics",{pin:PIN(),from:$("aFrom").value,to:$("aTo").value});
    $("anaKpi").innerHTML=`
      <div class="b"><div class="v">${r.order_count||0}</div><div class="l">Order lines</div></div>
      <div class="b"><div class="v">${r.unique_customers||0}</div><div class="l">Customers</div></div>
      <div class="b"><div class="v">₹${r.total_revenue||0}</div><div class="l">Total</div></div>
      <div class="b"><div class="v">₹${r.paid_revenue||0}</div><div class="l">Paid</div></div>
      <div class="b"><div class="v">₹${r.pending_revenue||0}</div><div class="l">Pending</div></div>
      <div class="b"><div class="v">₹${(r.by_meal&&r.by_meal.Lunch)||0}/₹${(r.by_meal&&r.by_meal.Dinner)||0}</div><div class="l">Lunch / Dinner</div></div>`;
    $("anaItems").innerHTML=(r.top_items||[]).map(i=>`<tr><td>${i.name}</td><td style="text-align:right;font-weight:700;">${i.qty}</td></tr>`).join("")||'<tr><td class="muted">No data.</td></tr>';
  }
  // Customers
  async function loadCust(){
    const r=await api("ia_customers",{pin:PIN()}); const b=$("custBody"); b.innerHTML="";
    (r.customers||[]).forEach(c=>{ b.innerHTML+=`<tr><td>${c.name||""}</td><td>${c.phone}</td><td class="muted">${c.created_at||""}</td><td class="muted">${c.last_order||""}</td></tr>`; });
    if(!b.children.length) b.innerHTML='<tr><td colspan="4" class="muted">No employees yet.</td></tr>';
  }
</script>
</body>
</html>
